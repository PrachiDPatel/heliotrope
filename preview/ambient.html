<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/ambient/ambient.css"><style>
body{background:#0a0e13;margin:0;padding:20px;font-family:system-ui;color:#cfe0ea}
h3{font-weight:600;font-size:15px;margin:26px 0 8px}
.tile{width:350px;border-radius:16px;overflow:hidden;border:1px solid #223}
.solo{height:200px}
.combo{position:relative;height:280px}
.combo .amb-fireflies{position:absolute}
.glassdemo{position:absolute;left:24px;right:24px;top:120px;padding:18px}
.glassdemo h2{margin:0 0 6px;font-size:22px}
.glassdemo p{margin:0;font-size:13px;opacity:.85}
</style></head><body>
<h3>1 · sun-through-leaves</h3>
<div class="tile solo amb-sunleaves"></div>
<h3>2 · rainbow arc (on dark)</h3>
<div class="tile solo amb-rainbow" style="background-color:#0b1520"></div>
<h3>3 · fireflies (on dark)</h3>
<div class="tile solo" style="background:#060d16;position:relative">
  <img src="../assets/ambient/fireflies.svg" style="width:100%;height:100%">
</div>
<h3>4 · Pleiades (on dark card)</h3>
<div class="tile solo amb-pleiades" style="background-color:#0b1520"></div>
<h3>5 · combined: sun-leaves + fireflies + glass card + shimmer heading</h3>
<div class="tile combo amb-sunleaves">
  <div class="amb-fireflies">
    <span class="firefly" style="left:12%;top:30%"></span>
    <span class="firefly" style="left:34%;top:62%;animation-delay:-2s"></span>
    <span class="firefly" style="left:58%;top:24%;animation-delay:-4s"></span>
    <span class="firefly" style="left:78%;top:56%;animation-delay:-1s"></span>
    <span class="firefly" style="left:46%;top:80%;animation-delay:-5s"></span>
  </div>
  <div class="glassdemo amb-glass">
    <h2 class="amb-shimmer">Good evening</h2>
    <p>Tonight's check-in is ready when you are.</p>
  </div>
</div>
</body></html>
